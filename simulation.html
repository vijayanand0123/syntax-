<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Syntax Analyzer</title>

<style>
body {
  background:#0d0f14;
  color:#e8eaf0;
  font-family:monospace;
  padding:20px;
}
textarea {
  width:100%;
  height:200px;
  background:#0a0c12;
  color:white;
  padding:10px;
  border:1px solid #333;
}
button {
  margin-top:10px;
  padding:10px;
  background:#ff9900;
  border:none;
  font-weight:bold;
}
.result {
  margin-top:20px;
  padding:15px;
  border:1px solid #333;
}
</style>
</head>

<body>

<h2>🌳 Syntax Analyzer</h2>

<textarea id="code">int a = 5;</textarea>
<br>
<button onclick="checkSyntax()">Check Syntax</button>

<div class="result" id="result">Result will appear here</div>

<script>
function checkSyntax(){
  let code = document.getElementById("code").value.trim();

  // Simple rule: variable declaration
  let pattern = /^(int|float)\s+[a-zA-Z_]\w*\s*=\s*\d+\s*;$/;

  if(pattern.test(code)){
    document.getElementById("result").innerHTML =
      "✅ Syntax is CORRECT";
  } else {
    document.getElementById("result").innerHTML =
      "❌ Syntax ERROR";
  }
}
</script>

</body>
</html>
